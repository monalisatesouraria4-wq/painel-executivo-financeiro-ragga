name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  verificacoes:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Lint
        run: npm run lint

      # `LayoutProps`/`PageProps` (Next 16) são tipos GLOBAIS gerados em `.next/types` — o diretório é ignorado pelo Git e
      # não existe em um checkout limpo; sem esta etapa o `tsc` falha com "Cannot find name 'LayoutProps'".
      - name: Gerar tipos do Next.js
        run: npx next typegen
        working-directory: apps/web

      - name: Typecheck
        run: npm run typecheck

      - name: Testes unitários
        run: npm run test

      - name: Build
        run: npm run build
